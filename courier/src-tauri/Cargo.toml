[package]
name = "courier"
version = "0.1.0"
edition = "2021"

[lib]
name = "courier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
regex = "1.13.1"
url = "2.5.8"
base64 = "0.23.1"
rfd = "0.18.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "multipart", "cookies", "gzip", "stream"] }
futures-util = "0.3.34"

[profile.release]
lto = true
codegen-units = 1
strip = true
