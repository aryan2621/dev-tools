name: Courier

on:
  push:
    branches: [main]
    paths: ['courier/**', '.github/workflows/courier.yml']
  pull_request:
    paths: ['courier/**', '.github/workflows/courier.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Courier (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            bundles: app,dmg
          - name: Windows
            os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    concurrency:
      group: courier-${{ matrix.name }}-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: courier
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: courier/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: courier/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: courier/src-tauri

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - name: Build app
        id: build
        continue-on-error: ${{ runner.os == 'macOS' }}
        shell: bash
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Build app (retry)
        if: steps.build.outcome == 'failure' && runner.os == 'macOS'
        shell: bash
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: courier-${{ runner.os }}
          path: |
            courier/src-tauri/target/release/bundle/dmg/*.dmg
            courier/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
